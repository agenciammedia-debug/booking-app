<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprobar abono</title>
<style>
  :root { --bg:#F2F2F7; --card:#fff; --txt:#1c1c1e; --mut:#6e6e73; --ok:#34c759; --no:#ff3b30; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --txt:#f2f2f7; --mut:#98989d; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:20px; padding:24px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
  h1 { font-size:20px; margin:0 0 6px; }
  .sub { color:var(--mut); font-size:14px; margin-bottom:18px; }
  .resumen { font-size:18px; font-weight:600; line-height:1.4; margin:12px 0 22px; }
  button { width:100%; border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:600; color:#fff; margin-top:10px; }
  .ok { background:var(--ok); } .no { background:var(--no); }
  .chat { display:none; width:100%; text-align:center; text-decoration:none; border-radius:14px; padding:16px; font-size:17px; font-weight:600; color:#fff; background:#007aff; margin-top:10px; }
  .cerrar { background:transparent; color:#007aff; border:1.5px solid #007aff; }
  button:disabled { opacity:.5; }
  .foto { display:none; width:100%; border-radius:14px; margin:0 0 14px; max-height:46vh; object-fit:contain; background:#000; }
  .nofoto { display:none; font-size:13px; color:var(--mut); margin:0 0 12px; }
  .chatbox { display:none; margin:0 0 6px; max-height:34vh; overflow:auto; padding:10px; border-radius:14px; background:var(--bg); }
  .b { max-width:82%; padding:8px 11px; border-radius:16px; font-size:14px; line-height:1.3; margin:4px 0; white-space:pre-wrap; word-break:break-word; }
  .b.c { background:#e5e5ea; color:#000; margin-right:auto; border-bottom-left-radius:4px; }
  .b.m { background:#007aff; color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .msg { margin-top:16px; font-size:15px; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <h1>Abono de 10 soles</h1>
  <div class="sub">Revisa que el Plin al 906173357 haya llegado</div>
  <div class="resumen" id="resumen">Cargando…</div>
  <a id="fotoLink" target="_blank" rel="noopener"><img class="foto" id="foto" alt="Captura de pago" referrerpolicy="no-referrer"></a>
  <div class="nofoto" id="nofoto">No se guardó la foto de la captura: mírala en el chat.</div>
  <div class="chatbox" id="chatbox"></div>
  <button class="ok" id="bOk" disabled>✅ Aprobar y agendar</button>
  <button class="no" id="bNo" disabled>✖ Rechazar (pedir otra captura)</button>
  <a class="chat" id="bChat" href="#">💬 Ir al chat de la clienta</a>
  <button class="cerrar" id="bCerrar" type="button">Cerrar</button>
  <div class="msg" id="msg"></div>
</div>
<script>
  var API = 'https://script.google.com/macros/s/AKfycbz_vC73zfR0OxRum2qaDWGLDSaFA0YirDO4TvcuA3UsNv69DRS8ZW8A3mS4SSfeFJ7KfQ/exec';
  var id = new URLSearchParams(location.search).get('id') || '';
  function tk() { try { return localStorage.getItem('apiToken') || ''; } catch (e) { return ''; } }
  function llamar(action, extra) {
    var q = 'action=' + action + '&id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(tk());
    return fetch(API + '?' + q, { cache: 'no-store', redirect: 'follow' }).then(function (r) { return r.json(); });
  }
  function msg(t) { document.getElementById('msg').textContent = t; }
  function pedirClave() {
    var p = window.prompt('Escribe la clave de acceso de la app');
    if (p) { try { localStorage.setItem('apiToken', p.trim()); } catch (e) {} location.reload(); }
  }
  function verCaptura(k) {
    if (!k) return;
    fetch(API + '?action=capVer&sid=' + encodeURIComponent(k) + '&token=' + encodeURIComponent(tk()), { cache: 'no-store', redirect: 'follow' })
      .then(function (r) { return r.json(); }).then(function (j) {
        if (!j || !j.ok) return;
        if (j.img) {
          var f = document.getElementById('foto'); f.src = j.img; f.style.display = 'block';
          f.onerror = function () { f.style.display = 'none'; document.getElementById('nofoto').style.display = 'block'; };
          document.getElementById('fotoLink').href = j.img;
        } else document.getElementById('nofoto').style.display = 'block';
        if (j.chat) {
          var box = document.getElementById('chatbox'); box.style.display = 'block';
          String(j.chat).split('\n').forEach(function (l) {
            var i = l.indexOf('|'); if (i < 0) return;
            var d = document.createElement('div'); d.className = 'b ' + (l.slice(0, i) === 'C' ? 'c' : 'm');
            d.textContent = l.slice(i + 1); box.appendChild(d);
          });
          box.scrollTop = box.scrollHeight;
        }
      }).catch(function () {});
  }
  function cargar() {
    if (!id) {
      var q = new URLSearchParams(location.search), u = (q.get('u') || '').replace(/^@/, '').trim(), n = (q.get('n') || '').trim();
      if (u) {
        document.getElementById('resumen').textContent = '⚠️ Captura sin reserva activa · ' + (n ? n + ' ' : '') + '(@' + u + ')';
        var c = document.getElementById('bChat'); c.href = 'https://ig.me/m/' + encodeURIComponent(u); c.style.display = 'block';
        msg('No hay un horario apartado para esta clienta. Revisa el chat.');
        verCaptura(q.get('k') || '');
      } else document.getElementById('resumen').textContent = 'Falta el id de la reserva';
      return;
    }
    llamar('reservaInfo').then(function (j) {
      if (j && j.error === 'No autorizado') return pedirClave();
      if (!j.ok) { document.getElementById('resumen').textContent = j.error || 'No se pudo cargar'; return; }
      document.getElementById('resumen').textContent = j.resumen;
      verCaptura(new URLSearchParams(location.search).get('k') || j.sid || '');
      var ig = String(j.ig || '').replace(/^@/, '').trim();
      if (ig) { var c = document.getElementById('bChat'); c.href = 'https://ig.me/m/' + encodeURIComponent(ig); c.style.display = 'block'; }
      if (j.estado === 'CONFIRMADA') { msg('✅ Ya estaba aprobada'); return; }
      if (j.estado === 'EXPIRADA') msg('⚠️ El horario ya se había liberado. Si apruebas, se intentará agendar de nuevo.');
      document.getElementById('bOk').disabled = false;
      document.getElementById('bNo').disabled = j.estado === 'EXPIRADA';
    }).catch(function () { msg('Error de conexión, intenta de nuevo'); });
  }
  function accion(a) {
    document.getElementById('bOk').disabled = true; document.getElementById('bNo').disabled = true; msg('Procesando…');
    llamar(a).then(function (j) {
      if (j.ok) msg(a === 'aprobar' ? '✅ Aprobado. La cita quedó agendada y se avisó a la clienta.' : '↩️ Rechazado. Se le pidió otra captura a la clienta.');
      else { msg('⚠️ ' + (j.error || 'No se pudo completar')); document.getElementById('bOk').disabled = false; }
    }).catch(function () { msg('Error de conexión, intenta de nuevo'); document.getElementById('bOk').disabled = false; });
  }
  document.getElementById('bOk').onclick = function () { accion('aprobar'); };
  document.getElementById('bNo').onclick = function () { accion('rechazar'); };
  document.getElementById('bCerrar').onclick = function () { location.href = './'; };
  cargar();
</script>
</body>
</html>
