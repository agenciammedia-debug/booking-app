<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#007AFF">
  <title>Abrir chat</title>
  <style>
    :root {
      --azul: #007AFF;
      --azul-hondo: #0051D5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--azul);
    }

    /* Toda la pantalla es el enlace: un toque en cualquier punto abre el DM. */
    .zona {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 32px calc(32px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(32px + env(safe-area-inset-left));
      text-decoration: none;
      color: #fff;
      background: linear-gradient(165deg, var(--azul) 0%, var(--azul-hondo) 100%);
      transition: filter 0.12s ease;
    }
    .zona:active { filter: brightness(0.88); }

    .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 14px;
    }
    .handle {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -1.2px;
      line-height: 1.05;
      text-align: center;
      margin: 0;
      word-break: break-word;
    }
    .accion {
      margin-top: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 600;
      padding: 15px 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .pista {
      margin-top: 18px;
      font-size: 14px;
      opacity: 0.72;
      text-align: center;
    }

    .pulso { animation: pulso 2s ease-in-out infinite; }
    @keyframes pulso {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.035); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulso { animation: none; }
    }
  </style>
</head>
<body>

  <a class="zona" id="zona" href="https://www.instagram.com/direct/inbox/">
    <div class="eyebrow" id="eyebrow">Solicitud de cita</div>
    <h1 class="handle" id="handle">&hellip;</h1>
    <div class="accion pulso">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l2-4.9A8.4 8.4 0 0 1 21 11.5z"></path>
      </svg>
      <span id="accionTexto">Toca para abrir el chat</span>
    </div>
    <div class="pista" id="pista">Se abre en la app de Instagram</div>
  </a>

  <script>
    (function () {
      var usuario = (new URLSearchParams(location.search).get('u') || '').trim().replace(/^@/, '');
      var zona = document.getElementById('zona');

      if (!usuario) {
        document.getElementById('eyebrow').textContent = 'Sin datos';
        document.getElementById('handle').textContent = 'No lleg\u00f3 el usuario';
        document.getElementById('accionTexto').textContent = 'Abrir la bandeja de Instagram';
        document.getElementById('pista').textContent = 'Busca la conversaci\u00f3n a mano';
        return;
      }

      document.getElementById('handle').textContent = '@' + usuario;

      // ig.me es el unico enlace que abre el hilo del DM. En iOS es un Universal
      // Link: solo salta a la app si lo toca el usuario, por eso esta en un <a>
      // real y no en un location.href automatico.
      zona.setAttribute('href', 'https://ig.me/m/' + encodeURIComponent(usuario));
    })();
  </script>

</body>
</html>
