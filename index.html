<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "ecd032a3-173d-410c-b6ee-be8d7bfee804",
      serviceWorkerPath: "/booking-app/OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/booking-app/" }

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Booking">
  <title>Booking App</title>
  <style>
    :root {
      --apple-blue: #007AFF;
      --bg-color: #F2F2F7;
      --card-bg: #FFFFFF;
      --text-main: #1C1C1E;
      --text-muted: #8E8E93;
      --border-color: #E5E5EA;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0; padding: 0;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }

    .view-container {
      flex: 1; overflow-y: auto; padding-bottom: 24px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
    .view { display: none; min-height: 100%; }
    .view.active { display: block; }

    .booking-content { padding: 24px 16px 0 16px; }
    .title { font-size: 28px; font-weight: 700; margin-bottom: 0; letter-spacing: -0.5px; }

    .segmented-control {
      display: flex; background-color: #E3E3E8;
      border-radius: 8px; padding: 2px; margin-bottom: 24px;
    }
    .seg-btn {
      flex: 1; text-align: center; padding: 8px 0;
      font-size: 14px; font-weight: 500;
      color: var(--text-main); background: transparent;
      border: none; border-radius: 6px; cursor: pointer;
      transition: all 0.2s ease;
    }
    .seg-btn.active {
      background-color: white;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04);
    }

    .fecha-wrapper { position: relative; flex: 1; display: flex; }
    #fechaPicker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    #btnFechaLabel { width: 100%; pointer-events: none; }

    .btn-primary {
      width: 100%; background-color: var(--apple-blue);
      color: white; font-size: 17px; font-weight: 600;
      padding: 14px; border: none; border-radius: 12px;
      cursor: pointer; box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
      transition: transform 0.1s ease;
    }
    .btn-primary:active { transform: scale(0.97); }

    .btn-secondary {
      width: 100%; background-color: #1C1C1E;
      color: white; font-size: 17px; font-weight: 600;
      padding: 14px; border: none; border-radius: 12px;
      cursor: pointer; transition: transform 0.1s ease;
    }
    .btn-secondary:active { transform: scale(0.97); }

    .client-input-wrapper { display: flex; margin-top: 24px; gap: 12px; }
    .client-input {
      flex: 1; background: #E3E3E8; border: none; border-radius: 12px;
      padding: 14px 16px; font-size: 17px; color: var(--text-main); outline: none;
    }
    .client-input::placeholder { color: var(--text-muted); }

    .config-num-btn {
      width: 50px; height: 50px; border-radius: 50%; border: none;
      background: #E3E3E8; color: var(--text-main); font-size: 18px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease;
    }
    .config-num-btn.selected {
      background: var(--apple-blue); color: white;
      box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
    }

    .btn-ig {
      background: #1C1C1E; color: white; border: none; border-radius: 12px;
      width: 50px; display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }
    .btn-ig:active { transform: scale(0.95); }

    .btn-square {
      background: #1C1C1E; color: white; border: none; border-radius: 10px;
      width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; font-size: 13px; font-weight: 700;
    }
    .btn-square:active { transform: scale(0.92); }

    .horario-btn {
      background: #E3E3E8; color: var(--text-main); border: none; border-radius: 20px;
      padding: 10px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
      transition: all 0.15s ease;
    }
    .horario-btn.selected {
      background: var(--apple-blue); color: white;
      box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
    }

    .duracion-select {
      width: 100%; background: #E3E3E8; border: none; border-radius: 12px;
      padding: 14px 16px; font-size: 17px; color: var(--text-main); outline: none;
    }

    .field-label {
      font-size: 13px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; display: block;
    }

    .evento-item {
      display: flex; align-items: center; gap: 10px; padding: 14px 0;
      border-bottom: 0.5px solid var(--border-color);
    }
    .evento-nombre {
      font-size: 16px; font-weight: 500; color: var(--text-main);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .evento-hora { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      display: flex; align-items: flex-end;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-sheet {
      background: white; width: 100%; max-height: 70vh; border-radius: 20px 20px 0 0;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex; flex-direction: column; padding-bottom: 30px;
    }
    .modal-overlay.active .modal-sheet { transform: translateY(0); }
    .modal-header {
      padding: 16px; text-align: center; font-weight: 600;
      border-bottom: 0.5px solid var(--border-color); position: relative; font-size: 17px;
    }
    .modal-header .close-btn {
      position: absolute; right: 16px; top: 16px; color: var(--apple-blue);
      background: none; border: none; font-size: 17px; cursor: pointer; font-weight: 500;
    }
    .ig-list { overflow-y: auto; padding: 0 16px; }
    .ig-item {
      padding: 16px 0; border-bottom: 0.5px solid var(--border-color);
      color: var(--text-main); cursor: pointer; font-size: 17px;
    }
    .ig-item:last-child { border-bottom: none; }

    .tab-bar {
      position: fixed; bottom: 0; width: 100%; background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid rgba(0,0,0,0.1); display: flex; justify-content: space-around;
      padding: 12px 0 24px 0; z-index: 100;
    }
    .tab-item {
      display: flex; flex-direction: column; align-items: center;
      color: var(--text-muted); cursor: pointer; font-size: 16px; font-weight: 600; flex: 1;
    }
    .tab-item.active { color: var(--apple-blue); }

    #toast {
      position: fixed; top: -50px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: white; padding: 12px 24px;
      border-radius: 20px; font-size: 15px; font-weight: 500;
      transition: top 0.3s ease; z-index: 1000;
    }

        .cal-nav { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .cal-nav-btn { background:#E3E3E8; border:none; width:40px; height:40px; border-radius:12px; font-size:22px; cursor:pointer; color:var(--text-main); }
    .cal-hoy-btn { background:#E3E3E8; border:none; height:40px; padding:0 14px; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; color:var(--apple-blue); }
    .cal-fecha-wrap { flex:1; position:relative; text-align:center; font-size:16px; font-weight:600; height:40px; line-height:40px; white-space:nowrap; overflow:hidden; }
    #calFechaPicker { position:absolute; inset:0; opacity:0; width:100%; height:100%; }
    .cal-grid { padding-right:8px; transition:opacity .2s; }
    .cal-allday { padding:0 0 8px 52px; display:flex; flex-direction:column; gap:4px; }
    .cal-allday-item { background:#8E8E93; color:#fff; border-radius:6px; padding:4px 8px; font-size:12px; font-weight:600; cursor:pointer; }
    .cal-body { position:relative; margin-top:10px; }
    .cal-line { position:absolute; left:48px; right:0; border-top:0.5px solid var(--border-color); }
    .cal-hora { position:absolute; left:0; width:42px; text-align:right; font-size:11px; color:var(--text-muted); transform:translateY(-50%); }
    .cal-eventos { position:absolute; top:0; bottom:0; left:52px; right:0; }
    .cal-evento { position:absolute; border-radius:6px; padding:3px 6px; color:#fff; overflow:hidden; box-sizing:border-box; font-size:12px; line-height:1.25; cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; transition:box-shadow .15s, transform .15s; }
    .cal-evento.arrastrando { z-index:50; box-shadow:0 8px 20px rgba(0,0,0,.3); transform:scale(1.03); transition:none; }
    .cal-evento-fijo { opacity:.7; }
    .cal-ev-t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cal-ev-s { opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cal-now { position:absolute; left:0; right:0; border-top:2px solid #FF3B30; z-index:40; pointer-events:none; }
    .cal-now::before { content:''; position:absolute; left:-5px; top:-6px; width:10px; height:10px; border-radius:50%; background:#FF3B30; }
    .btn-danger { width:100%; margin-top:10px; background:#FFE5E5; color:#FF3B30; font-size:17px; font-weight:600; padding:14px; border:none; border-radius:12px; cursor:pointer; }
  </style>
</head>
<body>

  <div id="toast">Copiado al portapapeles</div>

  <div class="view-container">
        <div id="view-agenda" class="view">
      <div class="booking-content">

  <script>
    // 🔧 PEGA AQUÍ TU URL DE APPS SCRIPT (la que termina en /exec)
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_vC73zfR0OxRum2qaDWGLDSaFA0YirDO4TvcuA3UsNv69DRS8ZW8A3mS4SSfeFJ7KfQ/exec';

    function llamarAPI(action, params) {
      params = params || {};
      let query = Object.keys(params)
        .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
        .join('&');
      let url = APPS_SCRIPT_URL + '?action=' + encodeURIComponent(action) + (query ? '&' + query : '');

      return fetch(url).then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      });
    }

    let selectedDateType = 'hoy';
    let customDate = null;
    let labelNombre = 'hoy';
    let igHandles = [];
    let igLoaded = false;
    let igLoading = false;
    let igSeleccionado = '';
    let numTrabajadores = parseInt(localStorage.getItem('numTrabajadores')) || 1;
    let duracionMinutos = 90;
    let buscandoHorarios = false;
    let horarioSeleccionado = null;
    let serviciosList = [];
    let serviciosLoading = false;
    let manicuristasList = [];
    let eventosHoyList = null;
    let eventosHoyLoading = false;

    const nombresMeses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

    window.onload = function() {
      precargarClientaDesdeURL();

      // Reacciona al toque de la notificación aunque la app ya estuviera abierta
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function(OneSignal) {
        OneSignal.Notifications.addEventListener('click', function(event) {
          const extra = (event && event.notification &&
                        (event.notification.additionalData || event.notification.data)) || {};
          mostrarSolicitud(extra.ig, extra.nombre);
        });
      });

      cargarClientesIG();
      cargarManicuristas();
      cargarServicios();
      cargarEventosHoy();
      actualizarBotonConfigLabel();
      actualizarHorarios();
      ajustarEspacioInferior();
      window.addEventListener('resize', ajustarEspacioInferior);
    };

      if (nombre) {
        document.getElementById('nombreClienta').value = nombre;
      }

      if (ig) {
        igSeleccionado = ig;

        label.innerText = '@' + ig;
        label.style.display = 'block';

      const anterior = document.getElementById('bannerSolicitud');
      if (anterior) anterior.remove();
      if (!ig) return;

      barra.id = 'bannerSolicitud';
      barra.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:500; display:flex; align-items:center; background:#007AFF; color:#fff; box-shadow:0 4px 14px rgba(0,0,0,0.18); padding-top:env(safe-area-inset-top);';

      enlace.style.cssText = 'flex:1; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 8px 14px 16px; color:#fff; text-decoration:none; overflow:hidden;';

        '</div>' +

    function copiarHorarios() {
      if (buscandoHorarios) return;

      let targetDate = getTargetDate();

      let btn = document.getElementById('btnCopiar');
      let originalText = btn.innerText;
      buscandoHorarios = true;
      btn.innerText = "Buscando...";
      btn.style.opacity = "0.7";
      btn.disabled = true;

      llamarAPI('horariosTexto', {
        fecha: targetDate.toISOString(),
        tipoDia: labelNombre,
        numTrabajadores: numTrabajadores,
        duracion: duracionMinutos
      })
        .then(function(textoFinal) {
          buscandoHorarios = false;
          btn.innerText = originalText;
          btn.style.opacity = "1";
          btn.disabled = false;

          if (typeof textoFinal !== 'string') {
            let msg = (textoFinal && textoFinal.error) ? textoFinal.error : 'Respuesta inesperada del servidor';
            alert('Error: ' + msg);
            return;
          }

          navigator.clipboard.writeText(textoFinal).then(() => {
            mostrarToast('Copiado al portapapeles');
          }).catch(err => {
            let tempInput = document.createElement("textarea");
            tempInput.value = textoFinal;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            mostrarToast('Copiado al portapapeles');
          });
        })
        .catch(function(error) {
          buscandoHorarios = false;
          btn.innerText = originalText;
          btn.style.opacity = "1";
          btn.disabled = false;
          alert('Error al calcular horarios: ' + error.message);
        });
    }

    function actualizarHorarios() {
      duracionMinutos = parseInt(document.getElementById('duracionSelect').value, 10);
      horarioSeleccionado = null;

      let targetDate = getTargetDate();
      const container = document.getElementById('horariosBotonesContainer');
      container.innerHTML = '<div style="color:var(--text-muted); font-size:14px;">Cargando horarios...</div>';

      llamarAPI('horariosArray', {
        fecha: targetDate.toISOString(),
        numTrabajadores: numTrabajadores,
        duracion: duracionMinutos
      })
        .then(function(horarios) {
          container.innerHTML = '';

          if (!Array.isArray(horarios)) {
            let msg = (horarios && horarios.error) ? horarios.error : 'Error al cargar horarios';
            container.innerHTML = '<div style="color:var(--text-muted); font-size:14px;">' + msg + '</div>';
            return;
          }

          if (horarios.length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted); font-size:14px;">No hay espacio disponible</div>';
            return;
          }

          horarios.forEach(hora => {
            let btn = document.createElement('button');
            btn.className = 'horario-btn';
            btn.innerText = hora;
            btn.onclick = function() {
              if (horarioSeleccionado === hora) {
                horarioSeleccionado = null;
                btn.classList.remove('selected');
              } else {
                document.querySelectorAll('.horario-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                horarioSeleccionado = hora;
              }

            container.appendChild(btn);

          ajustarEspacioInferior();
        })
        .catch(function(error) {
          container.innerHTML = '<div style="color:var(--text-muted); font-size:14px;">Error: ' + error.message + '</div>';

    function agendarCita() {
      if (!horarioSeleccionado) {
        alert('Selecciona un horario disponible primero.');
        return;
      }
      const clienteNombre = document.getElementById('nombreClienta').value.trim();
      if (clienteNombre === '') {
        alert('Escribe o selecciona el nombre/IG de la clienta.');
        return;
      }
      const manicurista = document.getElementById('manicuristaSelect').value;
      if (!manicurista) {
        alert('Selecciona una manicurista.');
        return;
      }
      const servicio = document.getElementById('servicioInput').value.trim();
      if (servicio === '') {
        alert('Escribe o selecciona el servicio.');
        return;
      }

      let targetDate = getTargetDate();
      let btn = document.getElementById('btnAgendar');
      let originalText = btn.innerText;
      btn.innerText = 'Agendando...';
      btn.disabled = true;
      btn.style.opacity = '0.7';

      llamarAPI('crearCita', {
        fecha: targetDate.toISOString(),
        hora: horarioSeleccionado,
        duracion: duracionMinutos,
        manicurista: manicurista,
        cliente: clienteNombre,
        servicio: servicio,
        ig: igSeleccionado
      })
        .then(function(resultado) {
          btn.innerText = originalText;
          btn.disabled = false;
          btn.style.opacity = '1';

          if (!resultado || !resultado.ok) {
            alert('Error al agendar: ' + (resultado && resultado.error ? resultado.error : 'desconocido'));
            return;
          }

          mostrarToast('Cita agendada ✓');

          horarioSeleccionado = null;
          document.getElementById('nombreClienta').value = '';
          document.getElementById('servicioInput').value = '';
          igSeleccionado = '';
          document.getElementById('igSeleccionadoLabel').style.display = 'none';
          eventosHoyList = null;

          actualizarHorarios();
        })
        .catch(function(error) {
          btn.innerText = originalText;
          btn.disabled = false;
          btn.style.opacity = '1';
          alert('Error al agendar: ' + error.message);
        });
    }

      // ===== CALENDARIO =====
    const CAL_HORA_INI = 9, CAL_HORA_FIN = 22, CAL_PX_HORA = 64, CAL_SNAP = 15;
    const CAL_COLORES = ['#007AFF', '#34C759', '#FF9500', '#AF52DE', '#FF2D55', '#5AC8FA', '#A2845E'];
    const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    let calSede = localStorage.getItem('calSede') || 'miraflores';
    let calFecha = new Date(); calFecha.setHours(0, 0, 0, 0);
    let calEventos = [];
    let calReq = 0;
    let calEventoActual = null;

    function fechaKeyLocal(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function formatHora12(d) {
      let h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      return h + (m ? ':' + String(m).padStart(2, '0') : '') + ap;
    }
    function rangoHora(a, b) { return formatHora12(new Date(a)) + ' – ' + formatHora12(new Date(b)); }
    function etiquetaHora(h) { return (h % 12 || 12) + ' ' + (h >= 12 ? 'pm' : 'am'); }
    function minDesdeInicio(ms) { return (ms - calFecha.getTime()) / 60000 - CAL_HORA_INI * 60; }
    function colorManicurista(ab) {
      ab = (ab || '').trim();
      if (!ab) return '#8E8E93';
      let h = 0;
      for (const c of ab) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return CAL_COLORES[h % CAL_COLORES.length];
    }

    function initCalendario() {
      document.querySelectorAll('#sedeControl .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.sede === calSede));
      cargarCalendario();
    }
    function cambiarSede(sede) { calSede = sede; localStorage.setItem('calSede', sede); initCalendario(); }
    function moverDia(n) { calFecha.setDate(calFecha.getDate() + n); cargarCalendario(); }
    function irHoy() { calFecha = new Date(); calFecha.setHours(0, 0, 0, 0); cargarCalendario(); }
    function elegirFechaCal(input) {
      if (!input.value) return;
      const p = input.value.split('-');
      calFecha = new Date(p[0], p[1] - 1, p[2]);
      cargarCalendario();
    }

    function actualizarLabelCal() {
      const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
      const diff = Math.round((calFecha - hoy) / 86400000);
      let txt = diasSemana[calFecha.getDay()] + ' ' + calFecha.getDate() + ' ' + nombresMeses[calFecha.getMonth()];
      if (diff === 0) txt = 'Hoy · ' + txt;
      else if (diff === 1) txt = 'Mañana · ' + txt;
      else if (diff === -1) txt = 'Ayer · ' + txt;
      document.getElementById('calFechaLabel').innerText = txt;
      document.getElementById('calFechaPicker').value = fechaKeyLocal(calFecha);
    }

    function cargarCalendario() {
      actualizarLabelCal();
      const req = ++calReq;
      const grid = document.getElementById('calGrid');
      calEventos = [];
      pintarCalendario();
      grid.style.opacity = '0.5';

      llamarAPI('eventosDia', { sede: calSede, fecha: fechaKeyLocal(calFecha) })
        .then(data => {
          if (req !== calReq) return;
          grid.style.opacity = '1';
          if (!Array.isArray(data)) { mostrarToast('Error: ' + ((data && data.error) || 'desconocido')); return; }
          calEventos = data;
          pintarCalendario();
        })
        .catch(err => {
          if (req !== calReq) return;
          grid.style.opacity = '1';
          mostrarToast('Error: ' + err.message);
        });
    }

    function asignarColumnas(evs) {
      let cluster = [], cols = [], clusterFin = 0;
      const cerrar = () => { cluster.forEach(e => e._nCols = cols.length); cluster = []; cols = []; clusterFin = 0; };
      evs.forEach(ev => {
        if (cluster.length && ev.inicio >= clusterFin) cerrar();
        let c = cols.findIndex(f => f <= ev.inicio);
        if (c === -1) { c = cols.length; cols.push(ev.fin); } else cols[c] = ev.fin;
        ev._col = c;
        cluster.push(ev);
        clusterFin = Math.max(clusterFin, ev.fin);
      });
      cerrar();
    }

    function pintarCalendario() {
      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';
      const totalMin = (CAL_HORA_FIN - CAL_HORA_INI) * 60;

      const todoDia = calEventos.filter(e => e.todoElDia);
      if (todoDia.length) {
        const bar = document.createElement('div');
        bar.className = 'cal-allday';
        todoDia.forEach(ev => {
          const c = document.createElement('div');
          c.className = 'cal-allday-item';
          c.textContent = ev.titulo;
          c.onclick = () => abrirModalEvento(ev);
          bar.appendChild(c);
        });
        grid.appendChild(bar);
      }

      const body = document.createElement('div');
      body.className = 'cal-body';
      body.style.height = (totalMin / 60 * CAL_PX_HORA) + 'px';

      for (let h = CAL_HORA_INI; h <= CAL_HORA_FIN; h++) {
        const y = (h - CAL_HORA_INI) * CAL_PX_HORA;
        const line = document.createElement('div');
        line.className = 'cal-line';
        line.style.top = y + 'px';
        body.appendChild(line);
        const lb = document.createElement('div');
        lb.className = 'cal-hora';
        lb.style.top = y + 'px';
        lb.textContent = etiquetaHora(h);
        body.appendChild(lb);
      }

      const capa = document.createElement('div');
      capa.className = 'cal-eventos';
      body.appendChild(capa);

      const timed = calEventos.filter(e => !e.todoElDia).sort((a, b) => a.inicio - b.inicio || b.fin - a.fin);
      asignarColumnas(timed);
      timed.forEach(ev => capa.appendChild(crearBloqueEvento(ev, totalMin)));

      if (fechaKeyLocal(new Date()) === fechaKeyLocal(calFecha)) {
        const min = minDesdeInicio(Date.now());
        if (min >= 0 && min <= totalMin) {
          const n = document.createElement('div');
          n.className = 'cal-now';
          n.style.top = (min / 60 * CAL_PX_HORA) + 'px';
          capa.appendChild(n);
        }
      }
      grid.appendChild(body);
    }

    function crearBloqueEvento(ev, totalMin) {
      const div = document.createElement('div');
      div.className = 'cal-evento' + (ev.recurrente ? ' cal-evento-fijo' : '');
      const t = Math.max(0, minDesdeInicio(ev.inicio));
      const b = Math.min(totalMin, minDesdeInicio(ev.fin));
      div.style.top = (t / 60 * CAL_PX_HORA) + 'px';
      div.style.height = Math.max(22, (b - t) / 60 * CAL_PX_HORA - 2) + 'px';
      div.style.left = 'calc(' + (ev._col / ev._nCols * 100) + '% + 1px)';
      div.style.width = 'calc(' + (100 / ev._nCols) + '% - 3px)';
      div.style.background = colorManicurista(ev.manicurista);
      div.innerHTML = '<div class="cal-ev-t"></div><div class="cal-ev-s"></div>';
      div.children[0].textContent = (ev.manicurista ? '[' + ev.manicurista + '] ' : '') + ev.cliente;
      div.children[1].textContent = rangoHora(ev.inicio, ev.fin) + (ev.servicio ? ' · ' + ev.servicio : '');
      activarArrastre(div, ev);
      return div;
    }

    // Toque = abrir detalle · Mantener presionado 350ms y arrastrar = mover
    function activarArrastre(div, ev) {
      let timer = null, startY = 0, startX = 0, top0 = 0, activo = false, movido = false, deltaMin = 0;

      function inicio(y, x) {
        startY = y; startX = x; top0 = parseFloat(div.style.top);
        activo = false; movido = false; deltaMin = 0;
        if (ev.recurrente) return;
        timer = setTimeout(() => {
          activo = true;
          div.classList.add('arrastrando');
          if (navigator.vibrate) navigator.vibrate(15);
        }, 350);
      }
      function mover(y, x, e) {
        if (!activo) {
          if (Math.abs(y - startY) > 8 || Math.abs(x - startX) > 8) { movido = true; clearTimeout(timer); }
          return;
        }
        e.preventDefault();
        deltaMin = Math.round(((y - startY) / CAL_PX_HORA * 60) / CAL_SNAP) * CAL_SNAP;
        div.style.top = (top0 + deltaMin / 60 * CAL_PX_HORA) + 'px';
        div.children[1].textContent = rangoHora(ev.inicio + deltaMin * 60000, ev.fin + deltaMin * 60000);
      }
      function fin() {
        clearTimeout(timer);
        if (activo) {
          activo = false;
          div.classList.remove('arrastrando');
          if (deltaMin !== 0) guardarMovimiento(ev, ev.inicio + deltaMin * 60000, ev.fin + deltaMin * 60000);
          return;
        }
        if (!movido) abrirModalEvento(ev);
      }

      div.addEventListener('touchstart', e => inicio(e.touches[0].clientY, e.touches[0].clientX), { passive: true });
      div.addEventListener('touchmove', e => mover(e.touches[0].clientY, e.touches[0].clientX, e), { passive: false });
      div.addEventListener('touchend', e => { e.preventDefault(); fin(); });
      div.addEventListener('touchcancel', () => {
        clearTimeout(timer);
        if (activo) { activo = false; pintarCalendario(); }
      });
      div.addEventListener('mousedown', e => {
        inicio(e.clientY, e.clientX);
        const mm = e2 => mover(e2.clientY, e2.clientX, e2);
        const mu = () => {
          document.removeEventListener('mousemove', mm);
          document.removeEventListener('mouseup', mu);
          fin();
        };
        document.addEventListener('mousemove', mm);
        document.addEventListener('mouseup', mu);
      });
    }

    function guardarMovimiento(ev, nuevoIni, nuevoFin) {
      const prevIni = ev.inicio, prevFin = ev.fin;
      ev.inicio = nuevoIni;
      ev.fin = nuevoFin;
      if (fechaKeyLocal(new Date(nuevoIni)) !== fechaKeyLocal(calFecha)) {
        calEventos = calEventos.filter(e => e !== ev);
      }
      pintarCalendario();

      llamarAPI('moverEvento', { sede: calSede, eventId: ev.id, inicio: nuevoIni, fin: nuevoFin })
        .then(r => {
          if (!r || !r.ok) throw new Error((r && r.error) || 'desconocido');
          mostrarToast('Cita actualizada ✓');
          eventosHoyList = null;
          if (calSede === 'miraflores') actualizarHorarios();
        })
        .catch(err => {
          ev.inicio = prevIni;
          ev.fin = prevFin;
          alert('No se pudo actualizar: ' + err.message);
          cargarCalendario();
        });
    }

    function abrirModalEvento(ev) {
      calEventoActual = ev;
      document.getElementById('meTitulo').textContent = ev.cliente;
      document.getElementById('meSub').textContent = [
        ev.todoElDia ? 'Todo el día' : rangoHora(ev.inicio, ev.fin),
        ev.servicio,
        ev.manicurista ? 'Manicurista: ' + ev.manicurista : ''
      ].filter(Boolean).join(' · ');

      const bloqueado = ev.recurrente || ev.todoElDia;
      document.getElementById('meEditor').style.display = bloqueado ? 'none' : 'block';
      document.getElementById('meAviso').style.display = bloqueado ? 'block' : 'none';

      if (!bloqueado) {
        const d = new Date(ev.inicio);
        document.getElementById('meFecha').value = fechaKeyLocal(d);
        document.getElementById('meHora').value = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

        const dur = Math.round((ev.fin - ev.inicio) / 60000);
        const opciones = [15, 30, 45, 60, 90, 120, 150, 180, 240];
        if (!opciones.includes(dur)) opciones.push(dur);
        opciones.sort((a, b) => a - b);

        const sel = document.getElementById('meDuracion');
        sel.innerHTML = '';
        opciones.forEach(m => {
          const o = document.createElement('option');
          o.value = m;
          o.textContent = m < 60 ? m + ' min' : (m / 60) + ' h';
          if (m === dur) o.selected = true;
          sel.appendChild(o);
        });
      }
      document.getElementById('modalEvento').classList.add('active');
    }

    function cerrarModalEvento() {
      document.getElementById('modalEvento').classList.remove('active');
    }

    function guardarEdicionEvento() {
      const ev = calEventoActual;
      if (!ev) return;
      const f = document.getElementById('meFecha').value;
      const h = document.getElementById('meHora').value;
      if (!f || !h) { alert('Completa fecha y hora'); return; }

      const [y, mo, d] = f.split('-').map(Number);
      const [hh, mm] = h.split(':').map(Number);
      const ini = new Date(y, mo - 1, d, hh, mm).getTime();
      const fin = ini + parseInt(document.getElementById('meDuracion').value, 10) * 60000;

      cerrarModalEvento();
      guardarMovimiento(ev, ini, fin);
    }

    function borrarEventoActual() {
      const ev = calEventoActual;
      if (!ev || !confirm('¿Eliminar la cita de ' + ev.cliente + '?')) return;

      cerrarModalEvento();
      calEventos = calEventos.filter(e => e !== ev);
      pintarCalendario();

      llamarAPI('borrarEvento', { sede: calSede, eventId: ev.id })
        .then(r => {
          if (!r || !r.ok) throw new Error((r && r.error) || 'desconocido');
          mostrarToast('Cita eliminada');
          eventosHoyList = null;
          if (calSede === 'miraflores') actualizarHorarios();
        })
        .catch(err => {
          alert('No se pudo eliminar: ' + err.message);
          cargarCalendario();
        });
    }

    
  </script>
